services:
  database:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=root
      - ORACLE_DATABASE=labo
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./scripts/:/tmp/scripts

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  oracle_data:
  mongo_data:
