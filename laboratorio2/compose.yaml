services:
  database:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=root
      - ORACLE_DATABASE=labo
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./scripts/:/tmp/scripts
volumes:
  oracle_data:
